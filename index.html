<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <!-- viewport-fit=cover: usa a tela toda no iPad/iPhone (as áreas seguras são respeitadas pelo CSS dos controles);
       sem zoom por pinça ou toque duplo, que atrapalhariam o analógico e os botões. -->
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#14100e">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Duelo Elemental">
  <title>Duelo Elemental</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
  <style>
    html, body { margin: 0; height: 100%; background: #14100e; overflow: hidden; overscroll-behavior: none;
      -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; -webkit-tap-highlight-color: transparent; }
    /* 100dvh: no Safari do iPad a barra de endereço não corta a parte de baixo (100vh como reserva). */
    canvas { touch-action: none; display: block; width: 100vw; height: 100vh; height: 100dvh; image-rendering: pixelated; }
  </style>
</head>
<body>
  <canvas id="game"></canvas>
  <script type="module" src="src/main.js"></script>
</body>
</html>
