# Publicação com 1 clique no Render (https://render.com): "New > Blueprint" apontando para este repositório.
services:
  - type: web
    name: elemental-arena
    runtime: node
    plan: free
    region: virginia # mais perto do Brasil que o padrão (oregon); só vale ao CRIAR o serviço
    buildCommand: npm ci --omit=dev
    startCommand: node server/server.js
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: NODE_VERSION
        value: 22
